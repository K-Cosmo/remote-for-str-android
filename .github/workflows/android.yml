name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Verify release certificate parser (legacy and Build Tools 37)
        shell: pwsh
        run: ./tools/test-apksigner-certificate.ps1

      - name: Parse-check offline Git history cleanup script (NO execution)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "tools/prepare-history-rewrite.ps1",
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell history-rewrite script syntax errors"
          }

      - name: Check documentation/version/release consistency
        shell: pwsh
        run: ./tools/verify-doc-consistency.ps1

      - name: Verify wrapper and build
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew clean :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:assembleRelease :app:lintRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: remote-for-str-debug
          path: app/build/outputs/apk/debug/app-debug.apk
